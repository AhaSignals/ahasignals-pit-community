name: Financial input checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/financial-input-audit.yml'

permissions:
  contents: read

jobs:
  financial-input-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_INPUT: research/audit-input.json
      UPLOAD_AUDIT_REPORT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned release
        shell: bash
        run: |
          printf '%s\n' 'ahasignals-pit==0.2.0rc1 --hash=sha256:63396ebcd7cd0b53be8503f92d54e82b288a8318a573f6d3ad0bd04c5540aad1' > "$RUNNER_TEMP/pit-requirements.txt"
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps -r "$RUNNER_TEMP/pit-requirements.txt"
      - name: Check declared financial inputs
        id: audit
        shell: bash
        run: |
          set +e
          python -m ahasignals_pit.audit_cli check --input "$AUDIT_INPUT" > audit-report.json
          audit_exit=$?
          set -e
          printf 'exit_code=%s\n' "$audit_exit" >> "$GITHUB_OUTPUT"
          printf 'Financial input check exit code: %s (0 PASS, 1 FAIL, 2 ERROR, 3 UNKNOWN).\n' "$audit_exit" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain report when explicitly enabled
        if: ${{ always() && env.UPLOAD_AUDIT_REPORT == 'true' && steps.audit.outputs.exit_code != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-input-report
          path: audit-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce the check result
        if: ${{ always() }}
        shell: bash
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          case "$AUDIT_EXIT" in
            0) exit 0 ;;
            1|2|3) exit "$AUDIT_EXIT" ;;
            *) printf '%s\n' 'The checker did not complete; downstream work is blocked.' >&2; exit 2 ;;
          esac
